spring.application.name=digital-banking
server.port=8085

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/tp_spring_angular_jwt
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Fichier de secrets (gitignoré) : contient OPENAI_API_KEY, TELEGRAM_BOT_TOKEN =====
spring.config.import=optional:file:./secret.properties

# ===== Spring AI / OpenAI (Chatbot RAG) =====
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small
# Ne pas planter le démarrage si la clé est absente
spring.ai.openai.chat.enabled=true

# ===== Bot Telegram (opt-in) =====
# Mettre TELEGRAM_ENABLED=true + token/username dans secret.properties pour activer
telegram.bot.enabled=${TELEGRAM_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# ===== JWT =====
# Secret HMAC (HS512) - a changer en production, ne pas committer un vrai secret
jwt.secret=9faf6b1b2c8f4d3e7a1c5e9b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0
jwt.access-token-validity-seconds=3600
