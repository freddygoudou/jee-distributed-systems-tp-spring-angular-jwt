<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h3 class="mb-4"><i class="bi bi-shield-lock me-2"></i>Changer mon mot de passe</h3>

    <div class="card shadow-sm">
      <div class="card-body">
        <p class="text-muted small">Utilisateur : <strong>{{ username }}</strong></p>

        @if (errorMsg()) { <div class="alert alert-danger py-2">{{ errorMsg() }}</div> }
        @if (successMsg()) { <div class="alert alert-success py-2">{{ successMsg() }}</div> }

        <form (ngSubmit)="submit()" #f="ngForm">
          <div class="mb-3">
            <label class="form-label">Ancien mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="oldPassword" name="oldPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" required minlength="4">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmer le nouveau mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="f.invalid || loading()">
            @if (loading()) { <span class="spinner-border spinner-border-sm me-1"></span> }
            Mettre à jour
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
