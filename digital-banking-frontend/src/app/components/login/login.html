<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-bank2 text-primary" style="font-size: 2.5rem;"></i>
          <h4 class="mt-2">Digital Banking</h4>
          <p class="text-muted small mb-0">Connectez-vous pour continuer</p>
        </div>

        @if (errorMsg()) {
          <div class="alert alert-danger py-2">{{ errorMsg() }}</div>
        }

        <form (ngSubmit)="submit()" #f="ngForm">
          <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <input class="form-control" [(ngModel)]="username" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit" [disabled]="f.invalid || loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            Se connecter
          </button>
        </form>

        <div class="mt-3 small text-muted text-center">
          Comptes de démo : <code>admin/admin</code> · <code>user/user</code>
        </div>
      </div>
    </div>
  </div>
</div>
