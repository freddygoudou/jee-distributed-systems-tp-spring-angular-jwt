server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API REST -> backend Spring Boot (même origine, pas de CORS côté navigateur)
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Authentification (login, register, profile, change-password...)
    location /auth/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Swagger (optionnel, pratique pour la démo)
    location /swagger-ui/ { proxy_pass http://backend:8085; }
    location /v3/api-docs { proxy_pass http://backend:8085; }

    # SPA Angular : toute autre route renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
